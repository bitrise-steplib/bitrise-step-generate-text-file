format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

workflows:

  # check: included from steps-check/steps.bitrise.yml

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    steps:
    - change-workdir:
        title: Switch working dir to _tmp
        inputs:
        - path: ./_tmp
        - is_create_path: true
    - path::./:
        title: Step Test
        inputs:
        - file_name: ./sample_text_file.txt
        - file_content: |
            Example file content,
            multi line!
    - script:
        title: Print the generated file path
        inputs:
        - content: |-
            #!/bin/bash
            echo "GENERATED_TEXT_FILE_PATH: $GENERATED_TEXT_FILE_PATH"

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main: {}
