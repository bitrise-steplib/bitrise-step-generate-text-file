title: |-
  Generate Text File
summary: |
  Dynamically generate a text file
description: |
  This Step lets you generate a dynamic text file which can use any environment
  variables. The path of the file will be made available as
  `$GENERATED_TEXT_FILE_PATH`. This Step can e.g. be used to generate the Play
  Store's "What's New" file based on the Git commit message.
website: https://github.com/bitrise-steplib/bitrise-step-generate-text-file
source_code_url: https://github.com/bitrise-steplib/bitrise-step-generate-text-file
support_url: https://github.com/bitrise-steplib/bitrise-step-generate-text-file/issues

type_tags:
- utility

is_always_run: false
is_skippable: false
run_if: ""

toolkit:
  go:
    package_name: github.com/bitrise-steplib/bitrise-step-generate-text-file

inputs:
- file_name: generated_text_file.txt
  opts:
    title: File Name
    summary: The name (or path) of the text file to generate.
    is_expand: true
    is_required: true
- file_content:
  opts:
    title: Content of the text file
    summary: Add content for the text file here. You can also use all ENV variables.
    is_expand: true
    is_required: true
outputs:
- GENERATED_TEXT_FILE_PATH:
  opts:
    title: Path to the generated text file
    summary: The absolute path of the text file generated by the Step.
